name: Implement site feature request
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Signed site issue number to retry
        required: true
        type: string
      revision:
        description: Signed follow-up comment ID to retry (leave blank for a new request)
        required: false
        type: string
      activity_check:
        description: Check live activity authentication only (no agent, issue changes or API spend)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Unrelated comments must not displace a pending, authenticated revision.
  group: feature-request-${{ (github.event_name != 'issue_comment' || ((github.event.comment.user.login == 'hlyall01' || github.event.comment.user.login == 'sim-gui-requests[bot]') && contains(github.event.comment.body, '<!-- sim-revision:v1:'))) && (github.event.issue.number || inputs.issue) || github.run_id }}
  cancel-in-progress: false
jobs:
  activity-check:
    if: github.event_name == 'workflow_dispatch' && inputs.activity_check == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify activity identity without modifying the ticket
        env:
          ISSUE_NUMBER: ${{ inputs.issue }}
        run: node scripts/check_activity.mjs
  prepare:
    if: >-
      vars.FEATURE_REQUESTS_ENABLED == 'true' &&
      inputs.activity_check != true &&
      (github.event_name == 'workflow_dispatch' ||
       (!github.event.issue.pull_request && (github.event.issue.user.login == 'hlyall01' || github.event.issue.user.login == 'sim-gui-requests[bot]') &&
        contains(github.event.issue.labels.*.name, 'site-request') &&
        (github.event_name == 'issues' || ((github.event.comment.user.login == 'hlyall01' || github.event.comment.user.login == 'sim-gui-requests[bot]') && contains(github.event.comment.body, '<!-- sim-revision:v1:')))))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      accepted: ${{ steps.prepare.outputs.accepted }}
      base: ${{ steps.base.outputs.sha }}
      source: ${{ steps.prepare.outputs.source }}
      pr_number: ${{ steps.prepare.outputs.pr_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Authenticate site request
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_SIGNING_SECRET: ${{ secrets.ISSUES_TOKEN }}
          OPENAI_CONFIGURED: ${{ secrets.OPENAI_API_KEY != '' && 'true' || '' }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
          REVISION_ID: ${{ github.event.comment.id || inputs.revision }}
        run: node scripts/feature_agent.mjs prepare
      - name: Include trusted runner helpers
        if: steps.prepare.outputs.accepted == 'true'
        run: cp scripts/{report_activity,patch_codex_action,test_codex_action}.mjs target/request-input/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.prepare.outputs.accepted == 'true'
        with:
          name: request-context
          path: target/request-input/
          retention-days: 7
  screen:
    needs: prepare
    if: needs.prepare.outputs.accepted == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    outputs:
      approved: ${{ steps.screen.outputs.approved }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: request-context
          path: target/request-input
      - name: Screen relevance before coding
        id: screen
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
          REVISION_ID: ${{ github.event.comment.id || inputs.revision }}
        run: node scripts/feature_agent.mjs screen
  code:
    needs: [prepare, screen]
    if: needs.screen.outputs.approved == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: request-context
          path: target/request-input
      - name: Prepare tools and prompt before entering sandbox
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
        run: |
          rustup toolchain install 1.91.1 --profile minimal --component rustfmt --target wasm32-unknown-unknown
          cargo +1.91.1 fetch --locked
          mkdir -p target/agent
          cp target/request-input/prompt.md target/agent/prompt.md
          touch target/agent/changes.patch
      - name: Check out pinned Codex action
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: openai/codex-action
          ref: 86365089eb2b84e0a8fb0717b304f8bdcb13b20e
          path: target/codex-action
          persist-credentials: false
      - name: Verify and fix Codex subprocess cleanup
        run: |
          node --test target/request-input/test_codex_action.mjs
          node target/request-input/patch_codex_action.mjs target/codex-action
      - name: Preserve runner DNS before privilege isolation
        # Upstream drop-sudo restricts system service sockets, which can stop
        # systemd-resolved. Use this runner's existing upstream DNS directly.
        run: |
          if test -s /run/systemd/resolve/resolv.conf; then
            sudo install --mode=0644 /run/systemd/resolve/resolv.conf /etc/resolv.conf
          fi
          python3 - <<'PY'
          import ipaddress
          from pathlib import Path
          servers = [line.split()[1] for line in Path('/etc/resolv.conf').read_text().splitlines()
                     if line.split() and line.split()[0] == 'nameserver']
          if not servers or any(ipaddress.ip_address(server).is_loopback for server in servers):
              raise SystemExit('Runner DNS still depends on a local resolver; refusing to start Codex.')
          PY
          getent hosts api.github.com results-receiver.actions.githubusercontent.com
      - name: Restore trusted build cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/wasm32-unknown-unknown
          key: web-${{ runner.os }}-1.91.1-${{ hashFiles('Cargo.lock') }}-${{ needs.prepare.outputs.base }}
          restore-keys: |
            web-${{ runner.os }}-1.91.1-${{ hashFiles('Cargo.lock') }}-
      - name: Start activity reporter
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
          REVISION_ID: ${{ github.event.comment.id || inputs.revision }}
          CODEX_HOME: ${{ runner.temp }}/feature-codex
          ACTIVITY_STOP_FILE: ${{ runner.temp }}/activity-stop
        run: |
          cp target/request-input/report_activity.mjs "$RUNNER_TEMP/report_activity.mjs"
          node "$RUNNER_TEMP/report_activity.mjs" > "$RUNNER_TEMP/activity-reporter.log" 2>&1 &
      - name: Implement feature in sandbox
        id: codex
        uses: ./target/codex-action
        env:
          RUSTUP_TOOLCHAIN: 1.91.1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-home: ${{ runner.temp }}/feature-codex
          # Keep the persisted event format used by the activity reporter stable.
          codex-version: '0.157.1'
          prompt-file: target/agent/prompt.md
          output-file: target/agent/result.json
          output-schema: >-
            {"type":"object","properties":{"status":{"type":"string","enum":["implemented","needs-info"]},"summary":{"type":"string"}},"required":["status","summary"],"additionalProperties":false}
          permission-profile: ':workspace'
          safety-strategy: drop-sudo
          # This issue-only app reaches coding only after signature and scope checks.
          allow-bot-users: 'sim-gui-requests[bot]'
          model: ${{ vars.FEATURE_AGENT_MODEL }}
          effort: medium
      # Only untrusted data transport follows the agent; publishing uses a fresh runner.
      - name: Flush final activity
        if: always()
        run: |
          touch "$RUNNER_TEMP/activity-stop"
          for attempt in $(seq 1 20); do
            test ! -f "$RUNNER_TEMP/report_activity.mjs" && break
            test -f "$RUNNER_TEMP/activity-stop.done" && break
            sleep 2
          done
      - name: Verify runner DNS for artifact upload
        run: getent hosts api.github.com results-receiver.actions.githubusercontent.com
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agent-candidate
          path: |
            target/agent/changes.patch
            target/agent/result.json
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [prepare, code]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write
    outputs:
      changed: ${{ steps.publish.outputs.changed }}
      sha: ${{ steps.publish.outputs.sha }}
      pr: ${{ steps.publish.outputs.pr }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.base }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: agent-candidate
          path: target/candidate
      - name: Validate patch and create or update draft PR
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
        run: |
          # Keep the status reporter on trusted main when the publisher checks out a PR.
          mkdir -p "$RUNNER_TEMP/trusted/scripts" "$RUNNER_TEMP/trusted/server"
          cp scripts/feature_agent.mjs "$RUNNER_TEMP/trusted/scripts/"
          cp scripts/screen_feature.mjs "$RUNNER_TEMP/trusted/scripts/"
          cp server/requests.mjs "$RUNNER_TEMP/trusted/server/"
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token;; *) printf "%%s\\n" "$GH_TOKEN";; esac\n' > "$RUNNER_TEMP/askpass"
          chmod 700 "$RUNNER_TEMP/askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/askpass" GIT_TERMINAL_PROMPT=0
          python3 scripts/publish_feature.py
      - name: Report pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
          REVISION_ID: ${{ github.event.comment.id || inputs.revision }}
          PR_URL: ${{ steps.publish.outputs.pr }}
          CANDIDATE_SHA: ${{ steps.publish.outputs.sha }}
          REQUEST_STATUS: ${{ steps.publish.outputs.changed == 'true' && 'building' || 'needs-info' }}
          AGENT_SUMMARY: ${{ steps.publish.outputs.summary }}
        run: node "$RUNNER_TEMP/trusted/scripts/feature_agent.mjs" status
  # GITHUB_TOKEN-created PRs do not trigger pull_request workflows; call builds explicitly.
  build:
    needs: publish
    if: needs.publish.outputs.changed == 'true'
    uses: ./.github/workflows/build-web.yml
    with:
      ref: ${{ needs.publish.outputs.sha }}
      artifact: feature-preview
  preview:
    needs: [prepare, publish, build]
    uses: ./.github/workflows/deploy-preview.yml
    with:
      artifact: feature-preview
      branch: ticket-${{ github.event.issue.number || inputs.issue }}
      sha: ${{ needs.publish.outputs.sha }}
      trusted_ref: ${{ needs.prepare.outputs.base }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  report:
    needs: [prepare, screen, code, publish, build, preview]
    if: always() && needs.prepare.outputs.accepted == 'true' && (needs.screen.result == 'failure' || needs.screen.result == 'cancelled' || (needs.screen.outputs.approved == 'true' && needs.publish.outputs.changed != 'false'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.base }}
          persist-credentials: false
      - name: Publish final status
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue }}
          REVISION_ID: ${{ github.event.comment.id || inputs.revision }}
          PR_URL: ${{ needs.publish.outputs.pr }}
          CANDIDATE_SHA: ${{ needs.publish.outputs.sha }}
          PREVIEW_URL: ${{ needs.preview.outputs.url }}
          REQUEST_STATUS: ${{ needs.preview.result == 'success' && 'ready' || 'failed' }}
        run: node scripts/feature_agent.mjs status
