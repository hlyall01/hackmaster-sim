name: Validate and build browser release
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      artifact:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: 1.91.1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install Rust and WASM target
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
      # Candidate builds must not write caches used by production.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/wasm32-unknown-unknown
          key: web-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ inputs.ref }}
          restore-keys: |
            web-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Test request validation and patch restrictions
        run: |
          node --test server/*.test.mjs
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_feature*.py'
      - name: Test simulator and check native targets
        run: |
          cargo test --locked --lib --bin sim_gui
          cargo check --locked --all-targets
      - name: Install matching wasm-bindgen CLI
        env:
          VERSION: 0.2.106
          SHA256: 3f3e7ae0c0a7448fcb00e9fc284477e0315ac0f1ff8328f32f6bf9ac7fe4b02c
        run: |
          archive="wasm-bindgen-${VERSION}-x86_64-unknown-linux-musl"
          curl --fail --location --retry 3 "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${VERSION}/${archive}.tar.gz" --output "$RUNNER_TEMP/bindgen.tar.gz"
          printf '%s  %s\n' "$SHA256" "$RUNNER_TEMP/bindgen.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/bindgen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
      - name: Build static WASM site
        run: python3 scripts/build_web.py
      - name: Save cache only from reviewed main builds
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            target/release
            target/wasm32-unknown-unknown
          key: web-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}-${{ inputs.ref }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ inputs.artifact }}
          path: target/web/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
