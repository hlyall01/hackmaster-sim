name: Build and deploy simulator
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: ./.github/workflows/build-web.yml
    with:
      ref: ${{ github.sha }}
      artifact: simulator-web
  preview:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/deploy-preview.yml
    with:
      artifact: simulator-web
      branch: pr-${{ github.event.pull_request.number }}
      sha: ${{ github.sha }}
      trusted_ref: ${{ github.event.pull_request.base.sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: cloudflare-pages
      url: https://sim-gui.com
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: simulator-web
          path: site
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Configure production backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          ISSUES_TOKEN: ${{ secrets.ISSUES_TOKEN }}
          FEATURE_REQUESTS_ENABLED: ${{ vars.FEATURE_REQUESTS_ENABLED }}
        run: |
          python3 scripts/configure_pages.py
          python3 -c 'from pathlib import Path; Path("site/_worker.js").write_text(Path("server/requests.mjs").read_text().replace("export async function", "async function"))'
          printf '{"version":1,"include":["/api/*","/1*","/2*","/3*","/4*","/5*","/6*","/7*","/8*","/9*"],"exclude":[]}' > site/_routes.json
      - name: Publish main
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.140.0'
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}
      - name: Report deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: printf 'Production deployed to https://sim-gui.com/ (%s)\n' "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
