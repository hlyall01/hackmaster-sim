name: Evaluate request screening
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Optional existing ticket to classify without starting an agent or modifying it
        required: false
        type: string
permissions:
  contents: read
  issues: read
jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Check representative requests without running a coding agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SCREEN_ISSUE: ${{ inputs.issue }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/evaluate_feature_screen.mjs
