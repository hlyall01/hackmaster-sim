[package]
name = "hackmaster_sim"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
bevy = { version = "0.13", optional = true }
bevy_egui = { version = "0.27", optional = true }
crossbeam-channel = "0.5"
eframe = { version = "0.27", features = ["glow"] }
egui_plot = "0.27"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
bevy = ["dep:bevy", "dep:bevy_egui"]

[[bin]]
name = "autobattler"
path = "src/bin/autobattler.rs"
required-features = ["bevy"]

[[bin]]
name = "autobattler_bevy"
path = "src/bin/autobattler_bevy.rs"
required-features = ["bevy"]

[[bin]]
name = "squad_battler_bevy"
path = "src/bin/squad_battler_bevy.rs"
required-features = ["bevy"]
