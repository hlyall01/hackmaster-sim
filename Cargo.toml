[package]
name = "hackmaster_sim"
version = "0.1.0"
edition = "2024"
build = "build.rs"
default-run = "sim_gui"
autobins = false
autoexamples = false

[dependencies]
eframe = { version = "0.27", features = ["glow"] }
egui_plot = "0.27"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "sim_gui"
path = "src/bin/sim_gui.rs"

[[example]]
name = "sim_capabilities"
path = "examples/sim_capabilities.rs"

[profile.release]
lto = "thin"
codegen-units = 1
