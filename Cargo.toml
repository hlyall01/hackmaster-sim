[package]
name = "hackmaster_sim"
version = "0.1.0"
edition = "2024"
build = "build.rs"
default-run = "sim_gui"
autobins = false
autoexamples = false

[dependencies]
eframe = { version = "0.27", features = ["glow"] }
egui_plot = "0.27"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "=0.2.106"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Clipboard", "Storage", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent", "DedicatedWorkerGlobalScope", "Performance"] }

[[bin]]
name = "sim_gui"
path = "src/bin/sim_gui.rs"

[[example]]
name = "sim_capabilities"
path = "examples/sim_capabilities.rs"

[profile.release]
lto = "thin"
codegen-units = 1
