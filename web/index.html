<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202020">
  <title>HackMaster Simulator</title>
  <link rel="icon" href="./icon.png">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #202020; color: #eee; font-family: system-ui, sans-serif; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #loading { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 2rem; }
    #loading[hidden] { display: none; }
    #loading p { max-width: 36rem; line-height: 1.5; }
    a { color: #a9d1ff; }
  </style>
</head>
<body>
  <canvas id="sim_canvas" aria-label="HackMaster combat simulator"></canvas>
  <div id="loading" role="status"><h1>HackMaster Simulator</h1><p id="status">Loading simulator…</p></div>
  <noscript>This simulator requires JavaScript and WebAssembly.</noscript>
  <script type="module" src="./main.js"></script>
</body>
</html>
