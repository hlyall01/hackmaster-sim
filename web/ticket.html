<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex"><title>Feature request · HackMaster Simulator</title>
  <link rel="icon" href="/icon.png"><link rel="stylesheet" href="/requests.css">
</head>
<body class="ticket-page">
  <header>
    <a href="https://feature.sim-gui.com/">← Feature requests</a>
    <h1 id="ticket-title">Loading feature request…</h1>
    <p id="ticket-status" role="status" aria-live="polite">Checking the coding agent’s progress…</p>
    <nav><a id="ticket-issue" hidden>GitHub ticket</a><a id="ticket-pr" hidden>Review pull request</a><a id="ticket-open" target="_blank" rel="noopener noreferrer" hidden>Open preview in a new tab</a></nav>
  </header>
  <iframe id="ticket-preview" title="Feature branch preview" sandbox="allow-scripts allow-same-origin allow-downloads" referrerpolicy="no-referrer" hidden></iframe>
  <script type="module" src="/ticket.js"></script>
</body>
</html>
